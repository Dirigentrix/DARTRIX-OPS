version: "1.0"
constellation:
  id: constellation_5
  name: "GitLab Showcase Constellation"
  description: "Primary constellation for the GitLab Showcase Track"

components:
  - id: audit_engine
    type: "engine"
    path: "core/engines/audit_engine.py"
    class: "AuditEngine"
    metadata:
      track: "GitLab Showcase Track"
      status: "registered"

  - id: neurodynamics_engine
    type: "engine"
    path: "core/engines/neurodynamics_engine.py"
    class: "NeurodynamicsEngine"
    metadata:
      track: "GitLab Showcase Track"
      architecture: "9-layer coupled oscillator"
      status: "registered"

  - id: constellation_5_core
    type: "core_system"
    metadata:
      version: "v5.0.0"
      environment: "production"

agent:
  name: "GitLab Showcase Agent"
  config:
    auto_registration: true
    heartbeat_interval: 60s
